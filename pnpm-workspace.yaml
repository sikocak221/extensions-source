packages:
  - src/*/*

# One version of the extension SDK, runtime and CLI for every extension ("catalog:" in package.json).
catalog:
  '@matane/extension-cli': ^0.2.0
  '@matane/extension-runtime': ^0.2.0
  '@matane/extension-sdk': ^0.2.0
  '@types/node': ^24.13.6

allowBuilds:
  esbuild: true

# Our own packages: trusted as soon as they are published (every version).
minimumReleaseAgeExclude:
  - '@matane/extension-cli'
  - '@matane/extension-runtime'
  - '@matane/extension-sdk'
